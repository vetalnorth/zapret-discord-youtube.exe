name: Auto-Sync & Build Release

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Sync upstream changes from Flowseal
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git remote add upstream https://github.com/Flowseal/zapret-discord-youtube.git
        git fetch upstream main
        git merge upstream/main -m "Auto-sync with upstream Flowseal" || exit 0
        git push origin main || echo "No changes to push"

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Build Launcher with Admin Manifest
      run: |
        go mod init zapret-launcher
        go get golang.org/x/sys/windows
        go get golang.org/x/sys/windows/registry
        go build -ldflags="-s -w" -o ZapretManager.exe main.go

    - name: Prepare Clean Distribution
      run: |
        mkdir dist
        copy ZapretManager.exe dist\
        copy general*.bat dist\
        xcopy bin dist\bin\ /E /I /Y
        xcopy lists dist\lists\ /E /I /Y
        copy README.md dist\
        compress-archive -Path dist\* -DestinationPath Zapret-Auto-Launcher.zip

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: "Zapret Auto Launcher (Flowseal Updated)"
        body: "Автоматическая сборка со свежими батниками Flowseal. Запуск через ZapretManager.exe."
        files: Zapret-Auto-Launcher.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
