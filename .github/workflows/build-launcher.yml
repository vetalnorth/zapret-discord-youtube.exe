name: Build Zapret Launcher

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Generate Windows Resources & Manifest
      run: |
        go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest
        goversioninfo versioninfo.json

    - name: Build Graphical Launcher
      run: |
        go mod init zapret-launcher
        go get golang.org/x/sys/windows
        go get golang.org/x/sys/windows/registry
        go build -ldflags="-H=windowsgui -s -w" -o zapret-launcher.exe main.go

    - name: Prepare Clean Distribution
      run: |
        mkdir dist
        copy zapret-launcher.exe dist\
        copy "general*.bat" dist\
        xcopy bin dist\bin\ /E /I /Y
        xcopy lists dist\lists\ /E /I /Y
        copy README.md dist\
        attrib +h dist\general*.bat

    - name: Upload Single Clean Archive
      uses: actions/upload-artifact@v4
      with:
        name: zapret-windows
        path: dist/
